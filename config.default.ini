[DEFAULT]
# Hughes Power Watchdog Discovery Configuration

# How often to scan for new Power Watchdog devices when discovery is enabled (seconds)
scan_interval = 60

# Polling interval is now configurable via the GUI slider in the
# Power Watchdog Manager switches pane (100ms - 10000ms, default 5000ms).

# Reconnect backoff after BLE disconnect (seconds)
reconnect_delay = 10
reconnect_max_delay = 120

# Optional: comma-separated adapter entries, handed to bleak-connection-manager
# verbatim and used to pick the adapter our own scans run on.
#
# NAME ADAPTERS BY MAC, not by hciN. The index is not an identity: a USB
# replug or a reboot renumbers the cards, and a stale number silently points
# at a different radio -- which is exactly how this service ended up scanning
# a card its device could not be heard on (2026-08-25). hciN is still accepted
# for compatibility, and is translated to the current index at use time.
#   00:1A:7D:DA:71:07                    place links on that card
#   AA:BB:CC:DD:EE:FF@00:1A:7D:DA:71:07  pin that device to that card
#                                        (repeat the device MAC for a fallback order)
# If empty or omitted, every adapter the kernel exposes is a candidate and the
# connection manager scores placement across them -- right on a box with no
# per-card allocation, wrong on one where each card has an assigned owner.
# bluetooth_adapters = 00:1A:7D:DA:71:07

# The connection manager (bleak-connection-manager's "bleak catcher") routes
# every BLE connection this process makes through claim-aware adapter selection,
# coordinated with other BLE services on this GX through claim files under
# /run/bt-claims.  Turn it off to connect with plain bleak +
# bleak-retry-connector, uncoordinated.
ble_connection_manager = true

# Established-link capacity per adapter, e.g. hci0:5, hci1:7.  Caps are
# deployment config, not discovery: dongle limits are undocumented (~5 is a
# workable start for CSR8510-based adapters, ~7 for Broadcom).  A full adapter
# is passed over instead of failing; an adapter with no cap is never gated.
# ble_link_caps = hci0:5

# Also route BleakScanner through the connection manager's adapter-bound,
# hard-claiming scanner (with its silence watchdog and adapter reset).  Off by
# default: it changes which adapter discovery scans run on, and a reset it
# decides on affects every service sharing that card.
ble_wrap_scanner = false
